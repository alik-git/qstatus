name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate locked source
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --extra dev --locked

      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          uv run python -c
          'import os, pathlib, sys, tomllib;
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"];
          actual = os.environ["RELEASE_TAG"];
          expected = f"v{version}";
          sys.exit(f"release tag {actual!r} does not match {expected!r}")
          if actual != expected else None'

      - name: Validate source
        run: |
          uv run ruff format --check --diff .
          uv run ruff check --output-format=full .
          uv run mypy
          uv run pytest
          uv build

  publish:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --extra dev --locked

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
